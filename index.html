<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myDreamPlace Web</title>
  </head>
  <body>
    <header class="#capçalera">
      <nav class="navegador">
        <button>
          <a href="#capçalera"
            ><img src="img/logo.png" alt="my Dream Place"
          /></a>
        </button>
        <ul class="nav-lista">
          <li class="el-lista"><a href="index.html">Home</a></li>
          <li class="el-lista"><a href="discover.html">Discover</a></li>
          <li class="el-lista"><a href="activities.html">Activities</a></li>
          <li class="el-lista"><a href="about.html">About</a></li>
          <li class="el-lista"><a href="contact.html">Contact</a></li>
        </ul>
        <div class="detalles">
          <img src="img/msg.png" alt="Notificaciones" />
          <img src="img/cuenta.png" alt="Foto de la cuenta" />
        </div>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="hero-contenido">
          <h1>Enjoy Your Dream Vacation</h1>
          <p>
            Plan and book our perfect trip with expert advice, travel tips,
            destination information and inspiration from us
          </p>
        </div>
      </section>
      <form class="search-form">
        <input
          type="text"
          placeholder="Where are you going?"
          aria-label="Destino"
        />

        <input type="date" aria-label="Fecha de entrada" />

        <input type="date" aria-label="Fecha de salida" />

        <input
          type="number"
          min="1"
          placeholder="Guests"
          aria-label="Número de huéspedes"
        />

        <button type="submit">Search</button>
      </form>
      <aside class="alert">
        <p>
          Check the latest COVID-19 restrictions before you travel.
          <a href="">Learn more</a>
        </p>
      </aside>
    </main>
  </body>
</html>
